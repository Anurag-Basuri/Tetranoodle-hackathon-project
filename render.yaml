# Render Blueprint specification for ScholarPilot AI backend
services:
  - type: web
    name: scholarpilot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: FRONTEND_ORIGIN
        value: https://scholarpilot.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
