# Docker Compose orchestrating ScholarPilot AI Swarm (Backend + Frontend)
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scholarpilot-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scholarpilot-frontend
    ports:
      - "3000:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: scholarpilot-network
